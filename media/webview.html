<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--CSP_PLACEHOLDER-->
    <title>Pet Agents</title>
    <link rel="stylesheet" href="<!--MEDIA:webview.css-->" />
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="tooltip"></div>
    <button id="care-toggle" class="corner" title="Pet care">🐾</button>
    <button id="bag-toggle" class="corner" title="Toy bag">🎒</button>
    <button id="settings-toggle" class="corner" title="Pet settings">⚙️</button>
    <button id="trophy-toggle" class="corner" title="Level, challenges and prompt records">
      🏆
    </button>
    <button id="house-toggle" class="corner" title="The pet's house">🏠</button>
    <div id="trophy-panel" class="panel" hidden>
      <div class="panel-head"><span id="trophy-title">🏆</span></div>
      <div id="trophy-tabs" class="tabs"></div>
      <div id="trophy-view"></div>
    </div>
    <div id="house-panel" class="panel" hidden>
      <div class="panel-head">
        <span>🏠 House</span>
        <span id="house-note" class="dim"></span>
        <button id="house-done" title="Hide this bar; 🏠 leaves the house">Done</button>
      </div>
      <div id="house-visit" class="food-choices" hidden></div>
      <div id="house-rooms" class="food-choices"></div>
      <div id="house-tabs" class="tabs"></div>
      <div id="house-items" class="food-choices house-grid"></div>
      <div id="house-themes" class="food-choices house-grid" hidden></div>
      <div id="house-picker" class="food-choices house-grid" hidden></div>
      <div id="house-profiles" class="food-choices house-grid" hidden></div>
    </div>
    <div id="welcome-panel" class="panel" hidden></div>
    <div id="finish-panel" class="panel" hidden>
      <div id="finish-body"></div>
      <div id="finish-actions" class="food-choices"></div>
    </div>
    <div id="bag-panel" class="panel" hidden>
      <div class="panel-head">
        <span id="bag-title">🎒 Bag</span>
        <button id="bag-store-all">Put all away</button>
      </div>
      <div id="bag-picker" class="food-choices"></div>
      <div id="bag-tabs" class="tabs"></div>
      <div id="bag-view">
        <div id="bag-odds" class="panel-note"></div>
        <div id="bag-grid"></div>
        <div class="panel-note">Click a toy to take it out, click again to put it away.</div>
      </div>
      <div id="collection-view" hidden></div>
      <div id="shop-view" hidden></div>
    </div>
    <div id="settings-panel" class="panel" hidden>
      <div id="companion-switch" class="food-choices"></div>
      <label
        ><input type="checkbox" data-setting="variety" /> 🎲 Random animations and hobbies</label
      >
      <label><input type="checkbox" data-setting="wander" /> 🚶 Wander around</label>
      <label><input type="checkbox" data-setting="toys" /> 🧸 New toys turn up</label>
      <label
        ><input type="checkbox" data-setting="machines" /> 🧺 Machines for tests and jobs</label
      >
      <label
        ><input type="checkbox" data-setting="backgroundPets" /> 🐾 Pets for other sessions in this
        repo</label
      >
      <label
        ><input type="checkbox" data-setting="otherRepoPets" /> 🗺️ Other repos' agents when this
        repo has none</label
      >
      <label><input type="checkbox" data-setting="stateColors" /> 🌈 State colours</label>
      <label><input type="checkbox" data-setting="holidays" /> 🎃 Holiday events</label>
      <label><input type="checkbox" data-setting="records" /> 🏆 Weekly prompt records</label>
      <label
        ><input type="checkbox" data-setting="recordsShowPrompts" /> 👀 Show prompts on the records
        board</label
      >
      <label><input type="checkbox" data-setting="levels" /> ⭐ Levels and challenges</label>
      <label><input type="checkbox" data-setting="enemies" /> 🐛 Bugs to squash</label>
      <label><input type="checkbox" data-setting="house" /> 🏠 The pet's house</label>
      <label
        ><input type="checkbox" data-setting="visitors" /> 🚶 Visitors (food, rain and
        playmates)</label
      >
      <details>
        <summary>🎭 Actions (untick the ones you don't like)</summary>
        <div id="action-list"></div>
      </details>
      <details>
        <summary>💾 Saves and sharing</summary>
        <div id="save-actions">
          <button data-save="share">📋 Share progress</button>
          <button data-save="export">📤 Share this profile...</button>
          <button data-save="new">➕ Start a new save...</button>
          <button data-save="move-out">🚚 Move my pet to another computer...</button>
          <button data-save="move-in">📦 Bring my pet here...</button>
        </div>
      </details>
      <details>
        <summary>🔔 Other agents (peon-ping)</summary>
        <div id="peon-guide"></div>
      </details>
      <button id="replay-tour" title="The short tour a new pet starts with">
        🎓 Replay the tour
      </button>
      <button id="gather-logs" title="Writes a snapshot to the Pet Agents log and opens it">
        🪵 Gather debug logs
      </button>
    </div>
    <div id="care-panel" hidden>
      <div class="care-bars">
        <div class="care-bar" title="Fullness">
          <span>🍖</span>
          <div class="track"><div class="fill" id="bar-fullness"></div></div>
        </div>
        <div class="care-bar" title="Happiness">
          <span>💖</span>
          <div class="track"><div class="fill" id="bar-fun"></div></div>
        </div>
        <div class="care-bar" title="Cleanliness">
          <span>🫧</span>
          <div class="track"><div class="fill" id="bar-clean"></div></div>
        </div>
      </div>
      <div class="care-actions">
        <button data-care="feed">🍖 Feed</button>
        <button data-care="treat">🍪 Treat</button>
        <button data-care="play">🎾 Play</button>
        <button data-care="bath">🛁 Bath</button>
      </div>
      <div id="food-picker" title="Food to feed" hidden></div>
      <div id="care-note"></div>
    </div>
    <script nonce="<!--NONCE-->" src="<!--MEDIA:pets.js-->"></script>
    <script nonce="<!--NONCE-->" src="<!--MEDIA:states.js-->"></script>
    <script nonce="<!--NONCE-->" src="<!--MEDIA:play.js-->"></script>
    <script nonce="<!--NONCE-->" src="<!--MEDIA:variants.js-->"></script>
    <script nonce="<!--NONCE-->" src="<!--MEDIA:scene.js-->"></script>
    <script nonce="<!--NONCE-->" src="<!--MEDIA:events.js-->"></script>
    <script nonce="<!--NONCE-->" src="<!--MEDIA:enemies.js-->"></script>
    <script nonce="<!--NONCE-->" src="<!--MEDIA:house.js-->"></script>
    <script nonce="<!--NONCE-->" src="<!--MEDIA:visitors.js-->"></script>
    <script nonce="<!--NONCE-->" src="<!--MEDIA:panels.js-->"></script>
    <script nonce="<!--NONCE-->" src="<!--MEDIA:finish.js-->"></script>
    <script nonce="<!--NONCE-->" src="<!--MEDIA:welcome.js-->"></script>
    <script nonce="<!--NONCE-->" src="<!--MEDIA:webview.js-->"></script>
  </body>
</html>
