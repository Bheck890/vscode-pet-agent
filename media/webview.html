<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--CSP_PLACEHOLDER-->
    <title>Pet Agents</title>
    <link rel="stylesheet" href="<!--CSS_URI-->" />
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="tooltip"></div>
    <button id="care-toggle" class="corner" title="Pet care">🐾</button>
    <button id="bag-toggle" class="corner" title="Toy bag">🎒</button>
    <button id="settings-toggle" class="corner" title="Pet settings">⚙️</button>
    <div id="bag-panel" class="panel" hidden>
      <div class="panel-head">
        <span id="bag-title">🎒 Bag</span>
        <span>
          <button id="bag-store-all">Put all away</button>
          <button id="shop-toggle">🛒 Shop</button>
        </span>
      </div>
      <div id="bag-view">
        <div id="bag-grid"></div>
        <div class="panel-note">Click a toy to take it out, click again to put it away.</div>
      </div>
      <div id="shop-view" hidden></div>
    </div>
    <div id="settings-panel" class="panel" hidden>
      <label
        ><input type="checkbox" data-setting="variety" /> 🎲 Random animations and hobbies</label
      >
      <label><input type="checkbox" data-setting="wander" /> 🚶 Wander around</label>
      <label><input type="checkbox" data-setting="toys" /> 🧸 New toys turn up</label>
      <label
        ><input type="checkbox" data-setting="machines" /> 🧺 Machines for tests and jobs</label
      >
      <label
        ><input type="checkbox" data-setting="backgroundPets" /> 🐾 Pets for other sessions in this
        repo</label
      >
      <label
        ><input type="checkbox" data-setting="otherRepoPets" /> 🗺️ Other repos' agents when this
        repo has none</label
      >
      <label><input type="checkbox" data-setting="stateColors" /> 🌈 State colours</label>
      <details>
        <summary>🎭 Actions (untick the ones you don't like)</summary>
        <div id="action-list"></div>
      </details>
    </div>
    <div id="care-panel" hidden>
      <div class="care-bars">
        <div class="care-bar" title="Fullness">
          <span>🍖</span>
          <div class="track"><div class="fill" id="bar-fullness"></div></div>
        </div>
        <div class="care-bar" title="Happiness">
          <span>💖</span>
          <div class="track"><div class="fill" id="bar-fun"></div></div>
        </div>
        <div class="care-bar" title="Cleanliness">
          <span>🫧</span>
          <div class="track"><div class="fill" id="bar-clean"></div></div>
        </div>
      </div>
      <div class="care-actions">
        <button data-care="feed">🍖 Feed</button>
        <button data-care="treat">🍪 Treat</button>
        <button data-care="play">🎾 Play</button>
        <button data-care="bath">🛁 Bath</button>
      </div>
      <div id="food-picker" title="Food to feed" hidden></div>
      <div id="care-note"></div>
    </div>
    <script nonce="<!--NONCE-->" src="<!--PETS_URI-->"></script>
    <script nonce="<!--NONCE-->" src="<!--PLAY_URI-->"></script>
    <script nonce="<!--NONCE-->" src="<!--VARIANTS_URI-->"></script>
    <script nonce="<!--NONCE-->" src="<!--SCENE_URI-->"></script>
    <script nonce="<!--NONCE-->" src="<!--SCRIPT_URI-->"></script>
  </body>
</html>
